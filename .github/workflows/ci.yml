name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml ./tools/autopsy
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q
      - run: autopsy --version
      - run: autopsy demo demo-logs
      - run: autopsy classify demo-logs/runner-disk-full.txt
      - run: python -c "import subprocess,sys; r=subprocess.run(['autopsy','classify','demo-logs/runner-disk-full.txt'],capture_output=True,text=True); sys.exit(0 if 'infra' in r.stdout else 1)"
