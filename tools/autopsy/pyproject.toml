[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-autopsy"
version = "0.1.0"
description = "Classify failed GitHub Actions runs: fetch logs via gh, match failure signatures, extract pytest summaries, advise the fix"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juzorei" }]
keywords = ["ci", "github-actions", "triage", "devops", "flaky-tests", "agent-skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/juzorei/ci-autopsy"

[project.scripts]
autopsy = "autopsy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
